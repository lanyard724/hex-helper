[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hex-helper"
version = "1.5.0"
description = "Read-only Windows overlay assistant for League of Legends ARAM: Mayhem (CN 26.23) with real-time 10-player matchup optimizer and direct Gemini AI Coach (optional local bridge)."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "Pillow>=10.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "dxcam>=0.3",
    "mss>=10.0",
    "winrt-runtime>=3.0",
    "winrt-Windows.Foundation>=3.0",
    "winrt-Windows.Foundation.Collections>=3.0",
    "winrt-Windows.Globalization>=3.0",
    "winrt-Windows.Graphics.Imaging>=3.0",
    "winrt-Windows.Media.Ocr>=3.0",
    "winrt-Windows.Storage.Streams>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hex-helper = "hex_helper.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hex_helper = ["assets/*.png", "assets/*.ico", "assets/*.json", "assets/fonts/*.ttf", "assets/fonts/*.otf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
